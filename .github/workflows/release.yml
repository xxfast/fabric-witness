on:
  push:
    tags:
      - 'v*'

name: Github Release

permissions:
  contents: write

jobs:
  build:
    name: Github Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setting version variable
        run: echo "release_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate artifact
        run: ./gradlew build

      # The jar always builds as fabric-witness.jar; only the release asset carries the version.
      - name: Name the release asset
        run: |
          ls ./build/libs
          cp ./build/libs/fabric-witness.jar \
             ./build/libs/fabric-witness-${{ env.release_version }}.jar

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.4.0
        with:
          version: ${{ env.release_version }}
          path: ./CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          draft: false
          prerelease: true
          files: ./build/libs/fabric-witness-${{ env.release_version }}.jar
